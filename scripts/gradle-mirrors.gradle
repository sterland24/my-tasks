// Local fallback repositories for this connection, including Flutter's included build.
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenCentral()
        gradlePluginPortal()
    }
}
settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        mavenCentral()
    }
}
allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            mavenCentral()
        }
    }
    if (!rootDir.toString().replace('\\', '/').contains('/packages/flutter_tools/gradle')) {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            mavenCentral()
        }
    }
}
